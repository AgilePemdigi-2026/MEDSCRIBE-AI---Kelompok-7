; Konfigurasi PHP untuk image aplikasi MedScribe AI (php:8.4-apache).
; Mengganti default php.ini-production yang membatasi upload (2M) dan memori (128M).

memory_limit = 512M

; Upload audio rekaman medis. Harus >= MEDSCRIBE_AUDIO_MAX_SIZE_KB (default 102400 KB = 100 MB).
upload_max_filesize = 128M
post_max_size = 136M

; Batas eksekusi request web (SAPI Apache). SAPI CLI (container queue/migrate) mengabaikan nilai ini.
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; Direktori sementara untuk buffer upload.
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; Session berbasis database, jadi file session tidak dipakai.
session.gc_maxlifetime = 7200
